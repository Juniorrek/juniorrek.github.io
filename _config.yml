# Site settings
# Most page content lives in _data/*.yml - edit those files, not the layouts.
title: David Reksidler Junior
author: David Reksidler Junior
email: juniorrek15@gmail.com
description: >-
  Full Stack Java Developer with 9 years of experience building large-scale
  academic platforms, based in Curitiba, Brazil. Java/Spring, Vue.js and Angular.
  M.Sc. in Computer Science and specialist in Applied AI and Agile Software
  Development.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://juniorrek.github.io" # the base hostname & protocol for your site
lang: en
github_username: Juniorrek

# Locales. Each `code` must match a directory under _data/ and the `lang:` in
# that language's index page front matter.
languages:
  - code: en          # _data/<code>/ and the page's `lang:`
    hreflang: en      # value used for <html lang> and hreflang
    name: English
    short: EN
    flag: "🇺🇸"
    url: /
  - code: pt-br
    hreflang: pt-BR
    name: Português (Brasil)
    short: PT-BR
    flag: "🇧🇷"
    url: /pt-br/

# Build settings
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

sass:
  style: compressed
  sass_dir: _sass
