# Site settings
# Most page content lives in _data/*.yml - edit those files, not the layouts.
title: David Reksidler Junior
author: David Reksidler Junior
email: juniorrek15@gmail.com
description: >-
  Senior Software Engineer with 9+ years modernizing and rebuilding Java
  systems for the Brazilian public sector, from legacy JSF/JSP to Spring Boot
  and Vue.js. Based in Curitiba, Brazil. M.Sc. in Computer Science and
  specialist in Applied AI.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://juniorrek.github.io" # the base hostname & protocol for your site
lang: en
github_username: Juniorrek

# Locales. Each `code` must match a directory under _data/ and the `lang:` in
# that language's index page front matter.
languages:
  - code: en          # _data/<code>/ and the page's `lang:`
    hreflang: en      # value used for <html lang> and hreflang
    name: English
    short: EN
    flag: "🇺🇸"
    url: /
  - code: pt-br
    hreflang: pt-BR
    name: Português (Brasil)
    short: PT-BR
    flag: "🇧🇷"
    url: /pt-br/

# Build settings
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

sass:
  style: compressed
  sass_dir: _sass
