  - period: 2018 - 2020
    degree: M.Sc. in Computer Science
    org: Universidade Federal do Paraná (UFPR)
    work:
      label: Dissertation
      name: Maximum clique in power-law graphs
      summary: >-
        Many real networks, from the web to social and biological networks,
        follow a power law in their vertex degrees, and greedy algorithms are
        known to work well on them in practice, with little theory explaining
        why. This dissertation studies the <strong>maximum clique problem</strong> on such
        graphs using a preferential attachment random graph model.
      result: >-
        Main result: a proof that, in power-law graphs grown by preferential
        attachment, the probability of a clique appearing <strong>decays
        exponentially with the clique size</strong> and is <strong>highest among the
        highest-degree vertices</strong>, which helps explain why greedy algorithms
        that start from those vertices perform well.
      case:
        id: case-proof
        title: Inside the proof
        problem: >-
          Greedy algorithms for maximum clique, which start from the
          highest-degree vertices, find optimal or near-optimal cliques on
          power-law graphs in experiments, but there was little theory
          explaining why.
        approach: >-
          Modeled the graphs with a preferential attachment random graph
          model (Hofstad's PA<sub>t</sub>(m)): vertices arrive one at a time
          and link to existing ones with probability proportional to their
          degree, which produces a power-law degree distribution. First proved
          a simple upper bound on each vertex's expected degree,
          E[D<sub>i</sub>(t)] ≤ t/i, replacing the exact expression in Gamma
          functions, then used it to bound the probability of each edge of a
          clique and combined those bounds over its ℓ(ℓ−1)/2 edges.
        result: >-
          For the ℓ vertices starting at position k (in decreasing degree
          order), the probability that they form a clique decays
          exponentially with ℓ and falls as k grows:
        formula: "Pr(E<sub>k,ℓ</sub>) = O(ℓ / k<sup>ℓ(ℓ−1)/2</sup>)"
        line:
          title: The bound by clique size, log scale
          x_label: Clique size ℓ
          xs: [3, 4, 5, 6]
          y_min: -13.0
          y_ticks: [0, -3, -6, -9, -12]
          series:
            - { label: "k = 2", ys: [-0.43, -1.2, -2.31, -3.74] }
            - { label: "k = 4", ys: [-1.33, -3.01, -5.32, -8.25] }
            - { label: "k = 8", ys: [-2.23, -4.82, -8.33, -12.77] }
          caption: >-
            Values of ℓ / k<sup>ℓ(ℓ−1)/2</sup>, the bound without its constant
            factor. On a log scale exponential decay is a straight line; these
            lines bend downward, so the bound falls at least exponentially as
            cliques grow.
        tech: [Probability, Random graphs, Asymptotic analysis]
      meta: "Advisor: Prof. Dr. Murilo Vicente Gonçalves da Silva · Defended in Aug 2020"
      tech: [Graph Theory, Combinatorial Optimization, Probability, Algorithms]
      links:
        - label: Read the dissertation
          url: https://acervodigital.ufpr.br/handle/1884/70774
        - label: See the visualiser in Projects
          url: "#projects"

