- name: Price Comparison App (Papa Preço)
  featured: true
  period: 
  status: Deploying to AWS
  image: /assets/images/papalogo.PNG
  image_fit: cover
  url: https://github.com/Juniorrek/papapreco
  summary: >-
    A collaborative price comparison app: shoppers report what they paid and
    where, and the app builds a shared, location-aware price history so everyone
    can find the cheapest nearby option.
  details:
    - Android app built with Flutter (Dart), backed by a Java/Spring Boot REST API.
    - Modeled the domain and persistence layer with PostgreSQL.
    - Containerised with Docker; currently being deployed to AWS.
    - Built as the final project of the Specialization in Agile Software Development, applying Scrum practices to its design and delivery.
  tech: [Flutter, Dart, Java, Spring Boot, PostgreSQL, Docker, AWS]
  links:
    - label: Source on GitHub
      url: https://github.com/Juniorrek/papapreco

