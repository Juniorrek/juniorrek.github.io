- name: Price Comparison App (Papa Preço)
  featured: true
  period: 2025
  status: Live on AWS · CI/CD with GitHub Actions
  image: /assets/images/papalogo.PNG
  image_fit: contain
  # Pixel-art logo: scale it without smoothing so it stays sharp.
  image_pixelated: true
  url: https://github.com/Juniorrek/papapreco
  summary: >-
    A collaborative price comparison app: shoppers report what they paid and
    where, and the app builds a shared, <strong>location-aware price history</strong> so everyone
    can find the cheapest nearby option.
  details:
    - Android app built with Flutter (Dart), backed by a Java/Spring Boot REST API. Prices come in by <strong>scanning the QR code of NFC-e receipts</strong> (Brazilian electronic invoices) or by hand.
    - <strong>Price alerts</strong> that send a push notification when someone reports a product at or below the user's target price.
    - Modeled the domain and persistence layer with PostgreSQL and <strong>versioned Flyway migrations</strong>.
    - API running on <strong>AWS (EC2) in Docker</strong>, behind Caddy for HTTPS.
    - "<strong>CI/CD with GitHub Actions</strong>: every merge to main builds the API image, publishes it to GitHub Container Registry and deploys it over AWS SSM, authenticated with OIDC instead of long-lived keys."
    - <strong>Signed release APK (v1.0.0)</strong> published through GitHub Releases, with email or Google Sign-In.
    - Built as the final project of the Specialization in Agile Software Development, applying Scrum practices to its design and delivery.
  tech: [Flutter, Java, Spring Boot, PostgreSQL, Docker, AWS]
  links:
    # The release page, not the .apk itself: it carries the install notes.
    - label: Download the Android APK (v1.0.0)
      url: https://github.com/Juniorrek/papapreco/releases/tag/v1.0.0
    - label: Source on GitHub
      url: https://github.com/Juniorrek/papapreco
  cases:
    - id: case-aws
      title: On AWS, sized for today with a path to scale
      problem: >-
        I wanted anyone who installs the APK to be able to use the app without
        running anything themselves, on a budget that fits a personal project,
        without closing the door to scaling later.
      approach: >-
        Built the infrastructure by hand first, to understand each piece: a
        cost budget alarm before any other resource, then a single EC2
        instance running the API and PostgreSQL with Docker Compose behind
        Caddy for HTTPS, with a security group that only opens what the app
        needs. The next steps are written down one new piece at a time:
        PostgreSQL on RDS, the infrastructure as Terraform, and a target
        architecture on ECS Fargate behind a load balancer.
      result: >-
        The API is live over HTTPS for <strong>about USD 20 a month</strong>, against roughly
        USD 56 for the Fargate setup. When load requires it, the instance can
        be resized (vertical scaling) or the API moved to Fargate behind a
        load balancer (horizontal scaling).
      tech: [AWS EC2, Docker Compose, Caddy, AWS Budgets]
  # Planned work, not shipped. Move an item into `details` once it is done.
  roadmap:
    title: Roadmap
    note: Planned next steps, each one written up here as it ships.
    items:
      - name: Asynchronous receipt processing
        note: NFC-e scraping moved to an SQS queue, with retries, a dead-letter queue and idempotency
      - name: Automated tests
        note: JUnit + Testcontainers against a real PostgreSQL, and Flutter unit tests
      - name: Observability
        note: Structured logs, correlation IDs, health and metrics endpoints, CloudWatch alarms
      - name: Performance
        note: Geospatial indexing and pagination for price searches
      - name: Web demo
        note: Flutter Web build on S3 + CloudFront

