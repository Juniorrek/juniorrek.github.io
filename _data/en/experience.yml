- period: 2017 - 2018
  role: Junior Developer
  org: Núcleo de Concursos - UFPR
  location:
  summary: >-
    Systems supporting the university's admission exams and quota-admission
    process.
  highlights:
    - Built a system managing the university's quota-admission verification process, with in-system video recording of candidate interviews, asynchronous review by evaluation boards, and final result generation (core Java, JSP/Servlets).
    - Developed features for university admission exam systems (Java, JSP, JavaScript, Oracle).
  tech: [Java, JSP/Servlets, JavaScript, Oracle]
  cases:
    - title: Quota-admission verification with recorded interviews
      problem: >-
        Candidates admitted through racial quotas have their self-declaration
        verified by evaluation boards (a process known in Brazil as
        heteroidentification). Interviews, board reviews and results needed to
        run in one place.
      approach: >-
        Built a system where candidate interviews are recorded on video inside
        the system, evaluation boards review the recordings asynchronously,
        and the final results are generated at the end. Core Java with
        JSP/Servlets.
      result: >-
        The whole process, from interview to final result, ran in a single
        system, and board members could review the recordings on their own
        schedule.
      flow:
        steps:
          - kicker: 1
            title: Interview
            note: Recorded on video inside the system
          - kicker: 2
            title: Board review
            note: Evaluation boards watch and decide asynchronously
          - kicker: 3
            title: Final result
            note: Generated by the system
      tech: [Java, JSP/Servlets, Video recording]

