  - period: 2018 - 2020
    degree: Mestrado em Informática
    org: Universidade Federal do Paraná (UFPR)
    work:
      label: Dissertação
      name: Clique máxima em grafos lei de potência
      summary: >-
        Muitas redes reais, da web às redes sociais e biológicas, seguem uma
        lei de potência nos graus dos vértices, e algoritmos gulosos funcionam
        bem nelas na prática, com pouca teoria explicando o porquê. A
        dissertação estuda o problema da clique máxima nesses grafos usando um
        modelo de grafo aleatório de ligação preferencial.
      result: >-
        Resultado principal: a prova de que a probabilidade de aparecer uma
        clique nesses grafos decai exponencialmente com o tamanho da clique, o
        que ajuda a explicar por que algoritmos gulosos que começam pelos
        vértices de grau alto têm bom desempenho.
      meta: "Orientação: Prof. Dr. Murilo Vicente Gonçalves da Silva · Defesa em ago 2020"
      tech: [Teoria dos Grafos, Otimização Combinatória, Probabilidade, Algoritmos]
      links:
        - label: Ler a dissertação
          url: https://acervodigital.ufpr.br/handle/1884/70774
        - label: Ver o visualizador em Projetos
          url: "#projects"

  - period: 2015 - 2017
    degree: Tecnologia em Análise e Desenvolvimento de Sistemas
    org: Universidade Federal do Paraná (UFPR) · graduação de 3 anos
    work:
      label: Trabalho de conclusão
      name: Artemis, mineração de texto para artigos científicos
      summary: >-
        Um sistema para analisar artigos científicos em escala: extração
        automática de termos, sumarização e agrupamento por similaridade sobre
        um corpus, além da avaliação de quanto essas técnicas ajudam um
        pesquisador a ler menos e encontrar mais. Feito com Java, R e MySQL.
        Software registrado.
      meta: "Trabalho em equipe com dois colegas · Orientação: Profª Drª Rafaela Mantovani Fontana"
      tech: [Mineração de Texto, PLN, Recuperação de Informação, Java, R]
      links:
        - label: Ler o trabalho
          url: https://acervodigital.ufpr.br/handle/1884/54046
        - label: Ver o software em Projetos
          url: "#projects"
