# "#projects", para nada ser escrito duas vezes. `result` aparece em destaque;
# `meta` é a letra miúda (orientação, data de defesa, autoria).

intro: >-

items:
  - period: 2024 - 2025
    degree: Especialização em Inteligência Artificial Aplicada
    org: Universidade Federal do Paraná (UFPR)
    work:
      label: Trabalho de conclusão
      name: PLN como ponte entre IA e Linguística
      summary: >-
        Um parecer técnico que percorre a evolução da IA, dos sistemas baseados
        em regras ao aprendizado de máquina e ao aprendizado profundo, com foco
        em processamento de linguagem natural: sua relação com a linguística,
        os desafios de ambiguidade e contexto, e o impacto dos modelos de
        linguagem de grande escala como o ChatGPT. Também documenta os projetos
        feitos ao longo do curso.
      meta: "Orientação: Profª Drª Rafaela Mantovani Fontana"
      tech: [PLN, LLMs, Aprendizado de Máquina, Aprendizado Profundo, Linguística]
      links:
        - label: Ler o trabalho
          url: https://acervodigital.ufpr.br/handle/1884/99842

  - period: 2023 - 2024
    degree: Especialização em Desenvolvimento Ágil de Software
    org: Universidade Federal do Paraná (UFPR)
    work:
      label: Trabalho de conclusão
      name: Aplicativo de Comparação de Preços (Papa Preço)
      summary: >-
        Aplicação de práticas Scrum na concepção e entrega de um produto
        completo, do backlog ao lançamento: um app Android em Flutter com uma
