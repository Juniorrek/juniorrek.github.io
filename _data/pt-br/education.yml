  - period: 2018 - 2020
    degree: Mestrado em Informática
    org: Universidade Federal do Paraná (UFPR)
    work:
      label: Dissertação
      name: Clique máxima em grafos lei de potência
      summary: >-
        Muitas redes reais, da web às redes sociais e biológicas, seguem uma
        lei de potência nos graus dos vértices, e algoritmos gulosos funcionam
        bem nelas na prática, com pouca teoria explicando o porquê. A
        dissertação estuda o <strong>problema da clique máxima</strong> nesses grafos usando um
        modelo de grafo aleatório de ligação preferencial.
      result: >-
        Resultado principal: a prova de que, em grafos lei de potência que
        crescem por ligação preferencial, a probabilidade de aparecer uma
        clique <strong>decai exponencialmente com o tamanho da clique</strong> e é <strong>maior entre
        os vértices de grau mais alto</strong>, o que ajuda a explicar por que
        algoritmos gulosos que começam por esses vértices têm bom desempenho.
      case:
        id: case-proof
        title: Por dentro da prova
        problem: >-
          Algoritmos gulosos para clique máxima, que começam pelos vértices de
          maior grau, encontram cliques ótimas ou quase ótimas em grafos lei
          de potência nos experimentos, mas havia pouca teoria explicando o
          porquê.
        approach: >-
          Modelei os grafos com um modelo de grafo aleatório de ligação
          preferencial (o PA<sub>t</sub>(m) de Hofstad): os vértices chegam um
          de cada vez e se ligam aos existentes com probabilidade proporcional
          ao grau deles, o que gera uma distribuição de graus em lei de
          potência. Primeiro provei um limitante superior simples para o grau
          esperado de cada vértice, E[D<sub>i</sub>(t)] ≤ t/i, no lugar da
          expressão exata em funções Gama, e depois o usei para limitar a
          probabilidade de cada aresta de uma clique e combinar esses limites
          nas suas ℓ(ℓ−1)/2 arestas.
        result: >-
          Para os ℓ vértices a partir da posição k (em ordem decrescente de
          grau), a probabilidade de formarem uma clique decai
          exponencialmente com ℓ e cai conforme k cresce:
        formula: "Pr(E<sub>k,ℓ</sub>) = O(ℓ / k<sup>ℓ(ℓ−1)/2</sup>)"
        line:
          title: O limitante por tamanho de clique, escala log
          x_label: Tamanho da clique ℓ
          xs: [3, 4, 5, 6]
          y_min: -13.0
          y_ticks: [0, -3, -6, -9, -12]
          series:
            - { label: "k = 2", ys: [-0.43, -1.2, -2.31, -3.74] }
            - { label: "k = 4", ys: [-1.33, -3.01, -5.32, -8.25] }
            - { label: "k = 8", ys: [-2.23, -4.82, -8.33, -12.77] }
          caption: >-
            Valores de ℓ / k<sup>ℓ(ℓ−1)/2</sup>, o limitante sem a constante.
            Em escala log, um decaimento exponencial é uma reta; estas linhas
            se curvam para baixo, então o limitante cai pelo menos
            exponencialmente conforme a clique cresce.
        tech: [Probabilidade, Grafos aleatórios, Análise assintótica]
      meta: "Orientação: Prof. Dr. Murilo Vicente Gonçalves da Silva · Defesa em ago 2020"
      tech: [Teoria dos Grafos, Otimização Combinatória, Probabilidade, Algoritmos]
      links:
        - label: Ler a dissertação
          url: https://acervodigital.ufpr.br/handle/1884/70774
        - label: Ver o visualizador em Projetos
          url: "#projects"

