about:
  - >-
    Sou Engenheiro de Software Sênior com <strong>mais de 9 anos modernizando e
    reconstruindo sistemas Java de médio e grande porte</strong> para o setor público
    brasileiro, de aplicações legadas em JSF/JSP a Spring Boot e Vue.js.
  - >-
    Hoje trabalho na plataforma de gestão de documentos da <strong>Câmara dos
    Deputados</strong>, com requisitos rígidos de segurança e conformidade. Antes disso,
    na <strong>Universidade Federal do Paraná (UFPR)</strong>, liderei a reconstrução do sistema
    de Iniciação Científica, que hoje atende mais de 10.000 usuários por ano.
  - >-
    <strong>Liderei times pequenos de desenvolvimento</strong>, conduzi entrevistas técnicas e
    code reviews, e trabalhei diretamente com stakeholders não técnicos,
    traduzindo trade-offs técnicos em decisões práticas.
  - >-
    <strong>Mestre em Informática</strong>, especialista em IA Aplicada e em Desenvolvimento
    Ágil de Software, com um ano avaliando profissionalmente código gerado por
    LLMs e uso diário de agentes de código com IA.

