about:
  - >-
    Sou Engenheiro de Software Sênior com mais de 9 anos modernizando e
    reconstruindo sistemas Java de médio e grande porte para o setor público
    brasileiro, de aplicações legadas em JSF/JSP a Spring Boot e Vue.js.
  - >-
    Hoje trabalho na plataforma de gestão de documentos da Câmara dos
    Deputados, com requisitos rígidos de segurança e conformidade. Antes disso,
    na Universidade Federal do Paraná (UFPR), liderei a reconstrução do sistema
    de Iniciação Científica, que hoje atende ~3.000 professores e mais de 7.500
    estudantes por ano.
  - >-
    Liderei times pequenos de desenvolvimento, conduzi entrevistas técnicas e
    code reviews, e trabalhei diretamente com stakeholders não técnicos,
    traduzindo trade-offs técnicos em decisões práticas.
  - >-
    Mestre em Informática, especialista em IA Aplicada e em Desenvolvimento
    Ágil de Software, com um ano avaliando profissionalmente código gerado por
    LLMs e uso diário de agentes de código com IA.

