# Tradução de _data/en/experience.yml. O inglês é a fonte: altere lá primeiro.
# Números iguais aos do CV; o JMeter sempre aparece como teste de carga local.

- period: Set 2026 - Atual
  role: Analista de TI Master (Engenheiro de Software Java)
  org: Grupo SOS Docs
  location:
  summary: >-
    Plataforma de gestão de documentos e processos da Câmara dos Deputados:
    um sistema legado Java/Nuxeo de grande porte, com requisitos rígidos de
    segurança e conformidade.
  highlights:
    - Construção de uma integração com um serviço externo de avisos usando cache e fallback, reduzindo a latência p95 do endpoint de 163 ms para 4 ms em teste de carga local com JMeter.
    - Ampliação da trilha de auditoria de conformidade, registrando ações antes não rastreadas, como eventos do fluxo de ciência e acesso a conteúdo sigiloso.
    - Investigação e correção de bugs de regra de negócio na plataforma e na sua API de integração Spring Boot/Oracle, incluindo a ordenação de números de protocolo com uma chave SQL normalizada e as regras de inclusão de documentos em dossiês.
    - Trabalho diário em toda a stack da plataforma, incluindo mensageria com RabbitMQ, OpenSearch e Keycloak.
    - Em ramp-up na modernização do sistema, uma reescrita completa com Spring Boot 4, Spring Modulith, DDD e arquitetura hexagonal, estudando os registros de decisão de arquitetura (ADRs) com o time.
  tech: [Java 8/11/25, Nuxeo, JSF, Spring Boot, Oracle, OpenSearch, RabbitMQ, Keycloak, Docker, Jenkins]
  cases:
    - title: Integração com serviço externo de avisos usando cache e fallback
      metric: "p95: 163 ms → 4 ms"
      problem: >-
        A plataforma precisava se integrar a um serviço externo de avisos.
        Chamá-lo a cada requisição deixaria o tempo de resposta do endpoint, e
        a sua disponibilidade, dependentes de um sistema fora do controle do
        time.
      approach: >-
        Coloquei um cache com fallback na frente da integração. O dado em cache
        vale por 300 s; quando expira, o serviço é chamado com timeout de 3 s
        e, se a chamada falhar ou estourar o tempo, os últimos dados conhecidos
        são servidos no lugar. Cada servidor chama o serviço externo no máximo
        uma vez a cada 5 minutos.
      result: >-
        Em teste de carga local com JMeter (5 usuários, ~140 requisições), a
        latência p95 foi de 163 ms para 4 ms, a mediana de 81 ms para 2 ms e a
        média de 91 ms para 11 ms. Quando o serviço externo está lento ou fora
        do ar, o usuário continua recebendo os últimos dados conhecidos.
      chart:
        title: Latência do endpoint, antes e depois
        unit: ms
        max: 163
        before_label: Antes
        after_label: Depois (cache + fallback)
        caption: Teste de carga local com JMeter, 5 usuários simultâneos, ~140 requisições. Não são medições de produção.
        rows:
          - { label: Média, before: 91, after: 11 }
          - { label: Mediana, before: 81, after: 2 }
          - { label: p95, before: 163, after: 4 }
      flow:
        title: Como uma requisição é atendida
        steps:
          - kicker: 1
            title: Chega a requisição
          - kicker: 2
            title: Cache ainda válido?
            note: "TTL 300 s. Sim: responde do cache"
          - kicker: 3
            title: Chama o serviço externo
            note: Timeout de 3 s, no máximo 1 vez a cada 5 min por servidor
            alt: "Em erro ou timeout: serve os últimos dados conhecidos"
          - kicker: 4
            title: Atualiza o cache e responde
      tech: [Java, Cache, JMeter]

- period: 2018 - 2026
  role: Desenvolvedor Java Full Stack Sênior
  org: FUNPAR - UFPR
  location:
  summary: >-
    Plataformas de gestão de bolsas e auxílios da Universidade Federal do
    Paraná (UFPR), incluindo o sistema de Iniciação Científica, que atende
    ~3.000 professores e mais de 7.500 estudantes por ano.
  highlights:
    - Reconstrução do sistema de Iniciação Científica da universidade do zero como líder técnico de um time de 3 a 4 desenvolvedores, substituindo uma aplicação legada por Java/Spring e Vue.js e migrando em fases para que o sistema continuasse no ar durante os períodos de inscrição.
    - Integração dos sistemas da universidade com a base Lattes do CNPq, processando o XML dos pesquisadores para automatizar a pontuação de produções nos rankings de bolsas.
    - Desenvolvimento e manutenção de outras plataformas de gestão de bolsas e auxílios, com integrações REST para buscar e validar dados entre sistemas da universidade.
    - Levantamento de requisitos e negociação de escopo diretamente com stakeholders não técnicos (professores e administração da universidade) em sistemas ligados aos editais de bolsas.
    - Code review, onboarding e entrevistas técnicas para desenvolvedores júnior e pleno.
    - Testes unitários e de integração com JUnit e Mockito, e modelagem de esquemas relacionais em Oracle e MySQL.
  tech: [Java 7/8/11/17, JSF, JSP, Spring Boot, Vue.js, Oracle, MySQL, RabbitMQ, JUnit, Mockito]
  cases:
    - title: Reconstrução do sistema de Iniciação Científica sem tirá-lo do ar
      metric: "~3.000 professores · 7.500+ estudantes / ano"
      problem: >-
        O sistema legado era em JSF e tinha ficado difícil de manter e de
        evoluir. Também era difícil montar o time: quem chegava geralmente
        conhecia Java puro ou um pouco de Spring, não JSF. E ele não podia
        simplesmente ser desligado, porque professores e estudantes dependem
        dele nos períodos de inscrição de cada edital.
      approach: >-
        Como líder técnico de um time de 3 a 4 desenvolvedores, reconstruí o
        sistema do zero, em fases. O novo sistema estreou como piloto no edital
        de 2022 (JSP com Vue.js), rodando em paralelo ao legado. As
        funcionalidades foram liberadas aos poucos, na ordem do próprio edital,
        começando pela inscrição e depois a avaliação, cada uma entregue quando
        o edital precisava dela. Depois o back-end passou para Spring Boot. A
        partir daí, todo edital novo nasceu no sistema novo, e uma fase
        posterior migrou os dados do legado.
      result: >-
        O sistema ficou no ar em todos os períodos de inscrição durante a
        migração, que levou cerca de um ano, e hoje atende ~3.000 professores e
        mais de 7.500 estudantes por ano. Os usuários ganharam melhorias pelo
        caminho, e o time ganhou um código mais fácil de manter e de receber
        novos desenvolvedores.
      flow:
        title: Linha do tempo da migração
        layout: vertical
        steps:
          - kicker: Antes de 2022
            title: Sistema legado em JSF
            note: Difícil de manter, evoluir e encontrar quem trabalhasse nele
          - kicker: Edital 2022
            title: Piloto em JSP + Vue.js
            note: Em paralelo ao sistema legado, um edital por vez
          - kicker: ~1 ano
            title: Entregas incrementais
            note: Funcionalidades na ordem do próprio edital, começando por inscrição e avaliação
          - kicker: Em seguida
            title: Back-end em Spring Boot
            note: Todo edital novo criado no sistema novo
          - kicker: ~2024
            title: Migração dos dados legados
            note: Dados dos editais antigos trazidos para o sistema novo
      tech: [Java, JSP, Vue.js, Spring Boot, Oracle]

    - title: Pontuação automática de produções a partir da base Lattes do CNPq
      problem: >-
        Os rankings de bolsas dependem da produção de cada pesquisador. Os
        critérios mudam de edital para edital, mas se baseiam em grande parte
        no Qualis: um artigo em periódico A1, por exemplo, pontua mais do que
        um em estrato inferior.
      approach: >-
        Integrei os sistemas da universidade à API do Lattes, baixando o
        currículo de cada pesquisador em XML, extraindo as produções e
        pontuando-as segundo os critérios do edital vigente.
      result: >-
        A pontuação de produções nos rankings de bolsas é calculada
        automaticamente a partir do Lattes de cada pesquisador.
      flow:
        title: Do Lattes ao ranking
        steps:
          - kicker: 1
            title: API do Lattes
            note: Baixa o currículo do pesquisador em XML
          - kicker: 2
            title: Leitura do XML
            note: Extrai produções, tipo e veículo
          - kicker: 3
            title: Pontuação
            note: Aplica os critérios do edital, como o estrato Qualis (A1 pontua mais)
          - kicker: 4
            title: Ranking de bolsas
      tech: [Java, XML, APIs REST]

