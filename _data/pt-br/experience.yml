- period: 2017 - 2018
  role: Desenvolvedor Júnior
  org: Núcleo de Concursos - UFPR
  location:
  summary: >-
    Sistemas de apoio aos processos seletivos da universidade e ao processo de
    ingresso por cotas.
  highlights:
    - Construção de um sistema para o <strong>processo de heteroidentificação</strong> da universidade, com gravação em vídeo das entrevistas dos candidatos dentro do sistema, avaliação assíncrona pelas bancas e geração do resultado final (Java puro, JSP/Servlets).
    - Desenvolvimento de funcionalidades para os sistemas de processos seletivos da universidade (Java, JSP, JavaScript, Oracle).
  highlights_short:
    - Construção do <strong>sistema de heteroidentificação</strong>, com entrevistas gravadas, avaliação assíncrona pelas bancas e resultado final (Java, JSP/Servlets).
    - Desenvolvimento de funcionalidades para os sistemas de processos seletivos (Java, JSP, JavaScript, Oracle).
  tech: [Java, JSP/Servlets, JavaScript, Oracle]
  cases:
    - id: case-quota
      title: Heteroidentificação com entrevistas gravadas
      problem: >-
        Candidatos que ingressam por cotas raciais têm a autodeclaração
        verificada por bancas de heteroidentificação. Entrevista, avaliação
        das bancas e resultado precisavam acontecer em um só lugar.
      approach: >-
        Construí um sistema em que a entrevista do candidato é gravada em vídeo
        dentro do próprio sistema, as bancas avaliam as gravações de forma
        assíncrona e o resultado final é gerado ao fim do processo. Java puro
        com JSP/Servlets.
      result: >-
        Todo o processo, da entrevista ao resultado final, passou a rodar em um
        <strong>único sistema</strong>, e os membros das bancas podiam avaliar as gravações no
        seu próprio tempo.
      flow:
        steps:
          - kicker: 1
            title: Entrevista
            note: Gravada em vídeo dentro do sistema
          - kicker: 2
            title: Avaliação da banca
            note: As bancas assistem e decidem de forma assíncrona
          - kicker: 3
            title: Resultado final
            note: Gerado pelo sistema
      tech: [Java, JSP/Servlets, Gravação de vídeo]

